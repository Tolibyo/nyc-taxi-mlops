



apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxi-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taxi
  template:
    metadata:
      labels:
        app: taxi
    spec:
      containers:
        - name: taxi
          image: nyc-taxi-serve:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: taxi-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          ports:
            - containerPort: 8000