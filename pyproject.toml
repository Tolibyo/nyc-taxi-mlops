[project]
name = "nyc-taxi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "scikit-learn",
    "joblib",
    "pydantic",
    "pandas",
]

[dependency-groups]
dev = [
    "polars",
    "mlflow",
    "evidently",
    "pytest",
    "ruff",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]